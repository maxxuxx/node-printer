name: CI

on:
  push:
    branches:
      - main
    paths:
      - "apps/**"
      - "libs/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig.json"
      - "eslint.config.js"
      - "vitest.config.ts"
      - ".github/workflows/ci.yml"
      - ".github/workflows/publish.yml"
      - "!**/*.md"
      - "!**/*.mdx"
      - "!apps/test-server/public/**"
  pull_request:
    paths:
      - "apps/**"
      - "libs/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig.json"
      - "eslint.config.js"
      - "vitest.config.ts"
      - ".github/workflows/ci.yml"
      - ".github/workflows/publish.yml"
      - "!**/*.md"
      - "!**/*.mdx"
      - "!apps/test-server/public/**"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: true

jobs:
  quality:
    name: Quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm and Node
        uses: pnpm/setup@v2
        with:
          runtime: node@22
          cache: true
          cache-dependency-path: pnpm-lock.yaml
          require-lockfile: true

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  platform-test:
    name: Test on ${{ matrix.os }}
    needs: quality
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: true
      matrix:
        os:
          - ubuntu-24.04-arm
          - macos-latest
          - windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm and Node
        uses: pnpm/setup@v2
        with:
          runtime: node@22
          cache: true
          cache-dependency-path: pnpm-lock.yaml
          require-lockfile: true

      - name: Test package
        run: pnpm --filter @maxxuxx/node-printer test

  prebuild-winspool:
    name: Winspool prebuild ${{ matrix.arch }}
    needs: platform-test
    runs-on: windows-2022
    timeout-minutes: 15
    strategy:
      fail-fast: true
      matrix:
        arch:
          - x64
          - ia32
          - arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24.x

      - name: Cache Node 20 native headers
        uses: actions/cache@v5
        with:
          path: apps/printer/.native-cache
          key: winspool-native-node20-${{ matrix.arch }}-v1

      - name: Build prebuild (${{ matrix.arch }})
        run: node apps/printer/scripts/prebuild-winspool.cjs ${{ matrix.arch }}

      - name: Check prebuild output
        shell: pwsh
        run: |
          $path = "apps/printer/prebuilds/win32-${{ matrix.arch }}/@node-printer+winspool.node"

          if (-not (Test-Path $path)) {
            throw "Missing $path"
          }

      - name: Upload prebuild artifact
        uses: actions/upload-artifact@v4
        with:
          name: winspool-prebuild-win32-${{ matrix.arch }}
          path: apps/printer/prebuilds/win32-${{ matrix.arch }}/@node-printer+winspool.node
          if-no-files-found: error
          retention-days: 7

  package:
    name: Verified npm package
    needs:
      - quality
      - platform-test
      - prebuild-winspool
    runs-on: windows-2022
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm and Node
        uses: pnpm/setup@v2
        with:
          runtime: node@22
          cache: true
          cache-dependency-path: pnpm-lock.yaml
          require-lockfile: true

      - name: Build package
        run: pnpm --filter @maxxuxx/node-printer build

      - name: Download prebuild artifacts
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download ${{ github.run_id }} --name winspool-prebuild-win32-x64 --dir apps/printer/prebuilds/win32-x64
          gh run download ${{ github.run_id }} --name winspool-prebuild-win32-ia32 --dir apps/printer/prebuilds/win32-ia32
          gh run download ${{ github.run_id }} --name winspool-prebuild-win32-arm64 --dir apps/printer/prebuilds/win32-arm64

      - name: Create verified package
        shell: pwsh
        run: |
          $artifactDir = Join-Path $env:GITHUB_WORKSPACE "artifacts"
          New-Item -ItemType Directory -Force -Path $artifactDir | Out-Null
          Push-Location apps/printer
          try {
            corepack pnpm pack --pack-destination $artifactDir
          } finally {
            Pop-Location
          }

      - name: Upload npm package
        uses: actions/upload-artifact@v4
        with:
          name: npm-package
          path: artifacts/*.tgz
          if-no-files-found: error
          retention-days: 7
