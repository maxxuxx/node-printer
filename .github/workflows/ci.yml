name: CI

on:
  push:
    branches:
      - main
    paths:
      - "apps/**"
      - "libs/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig.json"
      - "eslint.config.js"
      - "vitest.config.ts"
      - ".github/workflows/ci.yml"
      - ".github/workflows/publish.yml"
      - "!**/*.md"
      - "!**/*.mdx"
      - "!apps/test-server/public/**"
  pull_request:
    paths:
      - "apps/**"
      - "libs/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig.json"
      - "eslint.config.js"
      - "vitest.config.ts"
      - ".github/workflows/ci.yml"
      - ".github/workflows/publish.yml"
      - "!**/*.md"
      - "!**/*.mdx"
      - "!apps/test-server/public/**"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: true

jobs:
  validation:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: true
      matrix:
        include:
          - task: quality
            label: Quality gate
            os: ubuntu-latest
          - task: test
            label: Test on ubuntu-24.04-arm
            os: ubuntu-24.04-arm
          - task: test
            label: Test on macos-latest
            os: macos-latest
          - task: test
            label: Test on windows-latest
            os: windows-latest
          - task: prebuild
            label: Winspool prebuild x64
            os: windows-2022
            arch: x64
          - task: prebuild
            label: Winspool prebuild ia32
            os: windows-2022
            arch: ia32
          - task: prebuild
            label: Winspool prebuild arm64
            os: windows-2022
            arch: arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm and Node
        if: matrix.task != 'prebuild'
        uses: pnpm/setup@v2
        with:
          runtime: node@22
          cache: true
          cache-dependency-path: pnpm-lock.yaml

      - name: Lint
        if: matrix.task == 'quality'
        run: pnpm lint

      - name: Typecheck
        if: matrix.task == 'quality'
        run: pnpm typecheck

      - name: Test
        if: matrix.task == 'quality'
        run: pnpm test

      - name: Build
        if: matrix.task == 'quality'
        run: pnpm build

      - name: Test package
        if: matrix.task == 'test'
        run: pnpm --filter @maxxuxx/node-printer test

      - name: Setup Node
        if: matrix.task == 'prebuild'
        uses: actions/setup-node@v6
        with:
          node-version: 24.x

      - name: Cache Node 20 native headers
        if: matrix.task == 'prebuild'
        uses: actions/cache@v5
        with:
          path: apps/printer/.native-cache
          key: winspool-native-node20-${{ matrix.arch }}-v1

      - name: Build prebuild (${{ matrix.arch }})
        if: matrix.task == 'prebuild'
        run: node apps/printer/scripts/prebuild-winspool.cjs ${{ matrix.arch }}

      - name: Check prebuild output
        if: matrix.task == 'prebuild'
        shell: pwsh
        run: |
          $path = "apps/printer/prebuilds/win32-${{ matrix.arch }}/@node-printer+winspool.node"

          if (-not (Test-Path $path)) {
            throw "Missing $path"
          }

      - name: Upload prebuild artifact
        if: matrix.task == 'prebuild'
        uses: actions/upload-artifact@v6
        with:
          name: winspool-prebuild-win32-${{ matrix.arch }}
          path: apps/printer/prebuilds/win32-${{ matrix.arch }}/@node-printer+winspool.node
          if-no-files-found: error
          retention-days: 7

  package:
    name: Verified npm package
    needs: validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm and Node
        uses: pnpm/setup@v2
        with:
          runtime: node@22
          cache: true
          cache-dependency-path: pnpm-lock.yaml

      - name: Build package
        run: pnpm --filter @maxxuxx/node-printer build

      - name: Download prebuild artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download ${{ github.run_id }} --name winspool-prebuild-win32-x64 --dir apps/printer/prebuilds/win32-x64
          gh run download ${{ github.run_id }} --name winspool-prebuild-win32-ia32 --dir apps/printer/prebuilds/win32-ia32
          gh run download ${{ github.run_id }} --name winspool-prebuild-win32-arm64 --dir apps/printer/prebuilds/win32-arm64

      - name: Create verified package
        run: |
          mkdir -p artifacts
          pnpm --dir apps/printer pack --pack-destination "$GITHUB_WORKSPACE/artifacts"

      - name: Upload npm package
        uses: actions/upload-artifact@v6
        with:
          name: npm-package
          path: artifacts/*.tgz
          if-no-files-found: error
          retention-days: 7
