name: Publish

on:
  workflow_run:
    workflows:
      - CI
    branches:
      - main
    types:
      - completed

concurrency:
  group: publish-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'maxxuxx/node-printer' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      id-token: write

    steps:
      - name: Checkout verified revision
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24.x
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Download verified package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p artifacts
          gh run download "${{ github.event.workflow_run.id }}" --name npm-package --dir artifacts

      - name: Resolve package metadata
        id: package
        shell: bash
        run: |
          name="$(node -p "require('./apps/printer/package.json').name")"
          version="$(node -p "require('./apps/printer/package.json').version")"
          package_file="$(find artifacts -maxdepth 1 -name '*.tgz' -print -quit)"

          if [ -z "$package_file" ]; then
            echo "Verified npm package artifact is missing" >&2
            exit 1
          fi

          package_file="$(realpath "$package_file")"

          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "package_file=$package_file" >> "$GITHUB_OUTPUT"

          if npm view "$name@$version" version > /dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish verified package
        if: steps.package.outputs.published == 'false'
        run: npm publish "${{ steps.package.outputs.package_file }}" --access public --provenance

      - name: Verify npm registry
        if: steps.package.outputs.published == 'false'
        run: |
          expected="${{ steps.package.outputs.version }}"

          for attempt in $(seq 1 30); do
            actual="$(npm view "${{ steps.package.outputs.name }}@$expected" version --prefer-online 2>/dev/null || true)"

            if [ "$actual" = "$expected" ]; then
              exit 0
            fi

            if [ "$attempt" -lt 30 ]; then
              sleep 10
            fi
          done

          echo "npm registry did not expose $expected within 5 minutes" >&2
          exit 1

      - name: Skip existing version
        if: steps.package.outputs.published == 'true'
        run: echo "${{ steps.package.outputs.name }}@${{ steps.package.outputs.version }} is already published"
